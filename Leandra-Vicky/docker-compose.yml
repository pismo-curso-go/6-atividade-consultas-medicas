version: '3.8 '

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: consultas-medicas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data    
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultas-medicas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Interface Web para administração
  adminer:
    image: adminer:4.8.1
    container_name: postgres_admin
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: