version: '3.9'

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:13-alpine
    container_name: echo-clean-database
    restart: always
    environment:
      POSTGRES_DB: echo_clean_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgree/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echo_clean_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Go
  saudemais-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saudemais-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["./server"]

  # Adminer - Interface Web para administração
  adminer:
    image: adminer:4.8.1
    container_name: echo_clean_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
